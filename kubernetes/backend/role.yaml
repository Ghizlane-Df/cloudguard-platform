
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudguard-reader
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
    verbs:
      - get
      - list

  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
